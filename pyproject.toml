[project]
name = "gpt-image-skill"
version = "0.2.0"
description = "Agent skills for GPT Image 2/2.5 generation, editing, and image-to-prompt extraction, with a self-contained uv script."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "wuyoscar" },
]
keywords = [
  "gpt-image-2",
  "gpt-image",
  "gpt-image-2-prompts",
  "openai",
  "image-generation",
  "image-editing",
  "image-prompt",
  "text-to-image",
  "prompt-library",
  "prompt-templates",
  "image-to-prompt",
  "ai-image-prompts",
  "agent-skills",
  "codex-skill",
  "claude-code-skill",
  "research-figures",
  "ui-mockups",
  "game-hud",
  "typography",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "openai>=2.32.0",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/wuyoscar/gpt_image_2_skill"
Repository = "https://github.com/wuyoscar/gpt_image_2_skill"
Issues = "https://github.com/wuyoscar/gpt_image_2_skill/issues"

[tool.uv]
package = false
